<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore CSV files and ask natural-language questions alongside your data.">
  <title>CSV Data Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23173f2b'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16M12 9v14M20 9v14' stroke='%23fbfcf7' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=acef18010a2b">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>CSV Data Studio</h1>
      <div class="dataset-controls">
        <label class="sr-only" for="dataset-select">Active dataset</label>
        <select id="dataset-select"></select>
        <button id="upload-button" type="button">Upload CSV</button>
        <input id="file-input" class="sr-only" type="file" accept=".csv,text/csv">
      </div>
    </header>
    <section id="workspace" class="workspace" aria-label="Data workspace">
      <section class="data-panel" aria-labelledby="data-title">
        <header class="data-header">
          <div class="dataset-heading">
            <h2 id="data-title">Bundled sales data</h2>
            <p id="data-summary" class="muted">Loading dataset…</p>
          </div>
          <button id="open-chat" type="button" aria-controls="chat-panel" aria-expanded="true" hidden>Open chat</button>
        </header>
        <div class="data-toolbar">
          <label class="sr-only" for="row-search">Search rows</label>
          <input id="row-search" type="search" placeholder="Search rows…" disabled>
          <span class="read-only">Read-only</span>
        </div>
        <div id="data-table" class="data-table" tabindex="0" aria-label="Dataset rows"></div>
        <footer class="data-footer"><span id="row-status"></span><p id="data-status" role="status"></p></footer>
      </section>
      <aside id="chat-panel" class="chat-panel" aria-labelledby="chat-title">
        <header class="chat-header">
          <div><h2 id="chat-title">Ask your data</h2><p class="muted">Answers from the active CSV</p></div>
          <button id="close-chat" class="quiet-button" type="button" aria-label="Collapse chat panel" aria-controls="chat-panel" title="Collapse chat panel">⇥</button>
        </header>
        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
        <div class="chat-bottom">
          <div id="examples" class="examples" aria-label="Suggested questions"></div>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="question-input">Question</label>
            <textarea id="question-input" maxlength="500" rows="2" placeholder="Ask a question about this dataset…" required></textarea>
            <button id="send-button" type="submit">Send</button>
          </form>
          <p id="status" class="status" role="status"></p>
        </div>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="config.js?v=73a6639084b0"></script>
  <script src="app.js?v=b2f692effebf"></script>
</body>
</html>
